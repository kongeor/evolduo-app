version: '3'

services:
  database:
    image: 'postgres:15.18'
    container_name: evolduo_db

    ports:
      - "5432:5432"

    environment:
      POSTGRES_USER: evolduo
      POSTGRES_PASSWORD: evolduo
      POSTGRES_DB: evolduo

  redis:
    image: "redis:5.0.14"
    container_name: evolduo_redis

    ports:
      - "6379:6379"

    volumes:
      - $PWD/redis-data:/var/lib/redis