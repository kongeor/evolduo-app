name: evolduo app

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout git repository
        uses: actions/checkout@v7.0.1

      - name: Install clojure tools
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: 1.12.5.1664

      - name: Run tests
        run: clojure -X:test
